<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0,maximum-scale=1.0, user-scalable=no,viewport-fit=cover">
    <title>AllHomes | Soon</title>
    <link rel="stylesheet" href="style/index.css">
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
</head>

<body>
    <div class="video">
        <video src="https://d3b6muno9lbfvx.cloudfront.net/stub-test/bg.mp4" autoplay muted loop playsinline></video>
        <div class="video__bg"></div>
    </div>
    <div class="page">
        <header class="header">
            <div class="header__inner">
                <a href="/" class="logo"><img src="img/logo.svg" alt=""></a>
                <a href="tel:+998781228888" class="phone"><img src="img/phone.svg" alt="">
                    <div><span>+998</span> 78 122 88 88</div>
                </a>
            </div>
        </header>
        <main class="main">
            <h1 class="title">Скоро будет громко</h1>
            <p class="desc">Обновление рынка — <span>95%</span><br>
                Ты подключён?</p>
            <div class="timer">
                <div class="timer__wrap">
                    <div class="timer__wrap-num">
                        <div class="timer__wrap-count"><span data-time="day-1">0</span></div>
                        <div class="timer__wrap-count"><span data-time="day-2">0</span></div>
                    </div>
                    <div class="timer__wrap-desc">Дней</div>
                </div>
                <div class="timer__dots"><img src="img/dots.svg" alt=""></div>
                <div class="timer__wrap">
                    <div class="timer__wrap-num">
                        <div class="timer__wrap-count"><span data-time="hour-1">0</span></div>
                        <div class="timer__wrap-count"><span data-time="hour-2">0</span></div>
                    </div>
                    <div class="timer__wrap-desc">Часов</div>
                </div>
                <div class="timer__dots"><img src="img/dots.svg" alt=""></div>
                <div class="timer__wrap">
                    <div class="timer__wrap-num">
                        <div class="timer__wrap-count"><span data-time="min-1">0</span></div>
                        <div class="timer__wrap-count"><span data-time="min-2">0</span></div>
                    </div>
                    <div class="timer__wrap-desc">Минут</div>
                </div>
                <div class="timer__dots"><img src="img/dots.svg" alt=""></div>
                <div class="timer__wrap">
                    <div class="timer__wrap-num">
                        <div class="timer__wrap-count"><span data-time="sec-1">0</span></div>
                        <div class="timer__wrap-count"><span data-time="sec-2">0</span></div>
                    </div>
                    <div class="timer__wrap-desc">Секунд</div>
                </div>
            </div>
        </main>
        <footer class="footer">
            <div class="footer__left">
                <div class="footer__wrap">
                    <p class="footer__text">Здесь что-то намечается</p>
                    <a href="https://t.me/allhomes" class="footer__btn"><img src="img/tg.svg" alt="">Allhomes</a>
                </div>
            </div>
            <div class="footer__line"></div>
            <div class="footer__right">
                <div class="footer__wrap">
                    <a href="https://yandex.uz/maps/-/CHb2QH1P" target="_blank" class="footer__loc"><img
                            src="img/location.png" alt=""></a>
                    <a href="https://yandex.uz/maps/-/CHb2QH1P" target="_blank" class="footer__loc-mob"><img
                            src="img/location-mob.png" alt=""></ф>
                        <a href="https://yandex.uz/maps/-/CHb2QH1P" target="_blank" class="footer__adress"><img
                                src="img/location.svg" alt="">Ташкент,
                            ул.
                            Айбека 26</a>
                </div>
            </div>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
